<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Cluster Parkville</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body.landing .header {
  display:block;
}

body.landing .tab {
  display:none !important;
}

/* kalau bukan landing */
body:not(.landing) .header {
  display:none;
}
body {
  margin:0;
  font-family:Poppins,Arial;
  background:#f1f5f9;
  animation: bgGerak 15s ease infinite;
}
@keyframes fall {
  0% {
    transform: translateY(-50px) translateX(0) rotate(0deg);
    opacity: 0.9;
  }
  100% {
    transform: translateY(100vh) translateX(100px) rotate(360deg);
    opacity: 0;
  }
}
@keyframes bgGerak{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.navbar {
  position:fixed;
  top:0;
  width:100%;
  padding:15px 30px;
  display:flex;
  justify-content:space-between;
  background:#1e293b;
  color:white;
  z-index:1000;
}

.menu a {
  margin-left:15px;
  cursor:pointer;
}
.header {
  transition: all 0.5s ease;
}
.header {
  position: relative;
  width: 100%;
  height: 100vh; /* FULL LAYAR */
  overflow: hidden;
}

.header img {
  width: 100%;
  height: 100%;
  object-fit: cover; /* BIAR GA PEYOT */
}

/* MAP BOX */
.map-box {
  position: absolute;
  top: 30%;
  left: 40px;
  transform: translateY(-50%);

  width: 350px;
  height: 220px;

  border-radius: 15px;
  overflow: hidden;

  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}
.map-box {
  backdrop-filter: blur(10px);
  background: rgba(255,255,255,0.2);
}
.map-box iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

.tab {
  display:none;
  padding:90px 20px;
}

.tab.active {
  display:block;
}

.card {
  background:white;
  padding:20px;
  margin:15px;
  border-radius:12px;
  box-shadow:0 10px 20px rgba(0,0,0,0.1);
}

table {
  width:100%;
  border-collapse:collapse;
}

td,th {
  border-bottom:1px solid #ddd;
  padding:8px;
}

.bad { color:red; }

/* ===== HUJAN DAUN ===== */
.leaf {
  position: fixed;
  top: -50px;
  pointer-events: none;
  z-index: 9999;
  animation: fall linear forwards;
  opacity: 0.9;
}
</style>
</head>

<body>

<div class="navbar">
  <div onclick="goHome()" style="cursor:pointer;">ParkVille</div>
  <div class="menu">
    <a onclick="openTab('dashboard')">Dashboard</a>
    <a onclick="openTab('warga')">Warga</a>
    <a onclick="openTab('keuangan')">Keuangan</a>
    <a onclick="openTab('tunggakan')">Tunggakan</a>
    <a onclick="openTab('pengumuman')">Info</a>
    <a onclick="openTab('Media')">Media</a>
    <a onclick="openTab('iklan')">Lapak</a>
    <a onclick="openTab('Login')">Login</a>
  <span class="right-text">|   |</span>
  <span class="right-text">|   |</span>
	
  </div>
</div>

<!-- HEADER -->
<div class="header">
  <img src="rumah.jpg">
  <!-- MAP DI KANAN -->
  <div class="map-box">
    <iframe 
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d781.187301126062!2d106.3639380626069!3d-6.333661655464229!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x2e420fea0a38c1d7%3A0xfb4d090003739274!2sCluster%20Park%20Ville%20Citra%20Maja%20City!5e0!3m2!1sid!2sid!4v1777452049644!5m2!1sid!2sid"
      allowfullscreen=""
      loading="lazy">
    </iframe>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="tab active">
  <div class="card">
    <h3>Summary</h3>
    <p>Warga: <span id="wargaCount"></span></p>
    <p>Iuran: <span id="iuran"></span></p>
    
    <p style="font-size:12px;color:#64748b">
      Per Orang: Rp 15.000<br>
      (Kematian Rp5.000 • Satpam Rp5.000 • Kas Rp5.000)
    </p>
    
    <p>Sampah: <span id="sampah"></span></p>
    <p>Saldo: <b id="saldo"></b></p>
  </div>

  <div class="card">
    <h3>Grafik Bulanan</h3>
    <canvas id="chart"></canvas>
  </div>

  <div class="card">
    <h3>Kontak</h3>
    <div id="kontak"></div>
  </div>

</div>

<!-- WARGA -->
<div id="warga" class="tab">
  <div class="card">
    <h3>Data Warga</h3>
    <table id="tbWarga"></table>
  </div>
</div>

<div id="iklan" class="tab">
  <div class="card">
    <h3>⭐ Lapak Warga ⭐</h3>
    <div id="listIklan"></div>
  </div>
</div>
<!-- KEUANGAN -->
<div id="keuangan" class="tab">
  <div class="card">
    <h3>Keuangan</h3>
    <table id="tbKeu"></table>
  </div>
</div>

<!-- TUNGGAKAN -->
<div id="tunggakan" class="tab">
  <div class="card">
    <h3>Belum Bayar</h3>
    <table id="tbTunggakan"></table>
  </div>
</div>

<!-- PENGUMUMAN -->
<div id="pengumuman" class="tab">
  <div id="listPengumuman"></div>
</div>

<div id="Media" class="tab">
  <div class="card">
    <h3>📸 Kegiatan Warga</h3>
    <div id="gallery"></div>
  </div>
</div>
<script>

/* URL */
const URL_W="https://docs.google.com/spreadsheets/d/1KeenLY16qqCOwqn1CgryqHWEe7kSOjW6YmHzsZLy7SE/export?format=csv&gid=941193884";
const URL_B="https://docs.google.com/spreadsheets/d/1KeenLY16qqCOwqn1CgryqHWEe7kSOjW6YmHzsZLy7SE/export?format=csv&gid=595238022";
const URL_K="https://docs.google.com/spreadsheets/d/1KeenLY16qqCOwqn1CgryqHWEe7kSOjW6YmHzsZLy7SE/export?format=csv&gid=1027936274";
const URL_S="https://docs.google.com/spreadsheets/d/1KeenLY16qqCOwqn1CgryqHWEe7kSOjW6YmHzsZLy7SE/export?format=csv&gid=1872595743";
const URL_PROFILE="https://docs.google.com/spreadsheets/d/1KeenLY16qqCOwqn1CgryqHWEe7kSOjW6YmHzsZLy7SE/export?format=csv&gid=422911818";
const URL_PENGUMUMAN="https://docs.google.com/spreadsheets/d/1KeenLY16qqCOwqn1CgryqHWEe7kSOjW6YmHzsZLy7SE/export?format=csv&gid=941802545";
const URL_SALDO="https://docs.google.com/spreadsheets/d/1KeenLY16qqCOwqn1CgryqHWEe7kSOjW6YmHzsZLy7SE/export?format=csv&gid=508041483";

const URL_MEDIA = "https://docs.google.com/spreadsheets/d/1KeenLY16qqCOwqn1CgryqHWEe7kSOjW6YmHzsZLy7SE/gviz/tq?tqx=out:json&gid=784856855";
const URL_LAPAK =
"https://docs.google.com/spreadsheets/d/1KeenLY16qqCOwqn1CgryqHWEe7kSOjW6YmHzsZLy7SE/gviz/tq?tqx=out:json&gid=1556678723";

let W=[],B=[],K=[],S=[],P=[],PG=[],SA=[];
function goHome(){
  document.body.classList.add("landing");

  // reset semua tab
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
}
function csv(t){
  let l=t.trim().split("\n");
  let h=l[0].split(",");
  return l.slice(1).map(r=>{
    let c=r.split(",");
    let o={};
    h.forEach((x,i)=>o[x.trim().toLowerCase()]=(c[i]||"").trim());
    return o;
  });
}

function num(x){
  return parseFloat((x||"0").replace(/\./g,"").replace(",","."))||0;
}

function rp(x){
  return "Rp "+x.toLocaleString("id-ID");
}

/* ===== HUJAN DAUN ===== */
function hujanDaun(){
  setInterval(()=>{
    let leaf = document.createElement("div");
    leaf.className = "leaf";

    const daun = ["🍃","🍂","🌿","💧","❄️","🧊"];
    leaf.innerText = daun[Math.floor(Math.random()*daun.length)];

    leaf.style.left = Math.random() * window.innerWidth + "px";

    // speed beda2
    leaf.style.animationDuration = (4 + Math.random()*6) + "s, 3s";

    leaf.style.fontSize = (15 + Math.random()*25) + "px";

    document.body.appendChild(leaf);

    setTimeout(()=>leaf.remove(),10000);
  }, 250);
}
async function load(){
  try{
    let [w,b,k,s,p,pg,sa]=await Promise.all([
      fetch(URL_W).then(r=>r.text()),
      fetch(URL_B).then(r=>r.text()),
      fetch(URL_K).then(r=>r.text()),
      fetch(URL_S).then(r=>r.text()),
      fetch(URL_PROFILE).then(r=>r.text()),
      fetch(URL_PENGUMUMAN).then(r=>r.text()),
      fetch(URL_SALDO).then(r=>r.text())
    ]);

    W=csv(w); B=csv(b); K=csv(k); S=csv(s);
    P=csv(p); PG=csv(pg); SA=csv(sa);

    render();

  }catch(e){
    alert("Gagal load data. Pastikan Google Sheet public.");
    console.log(e);
  }
}

function render(){

  let iuran=B.reduce((a,b)=>a+num(b.jumlah),0);
  let sampah=S.reduce((a,b)=>a+num(b.jumlah),0);
  let keluar=K.reduce((a,b)=>a+num(b.jumlah),0);
  let saldoAwal=SA.length?num(SA[0].saldo):0;
  let saldo=saldoAwal+iuran+sampah-keluar;

  document.getElementById("wargaCount").innerText=W.length;
  document.getElementById("iuran").innerText=rp(iuran);
  document.getElementById("sampah").innerText=rp(sampah);
  document.getElementById("saldo").innerText=rp(saldo);

  warga();
  keuangan();
  tunggakan();
  kontak();
  pengumuman();
  grafik();
  hujanDaun();
  loadIklan();
}

/* ===== GRAFIK ===== */
function grafik(){
  let map={};

  B.forEach(x=>{
    let t=new Date(x.tanggal);
    let key=t.getFullYear()+"-"+(t.getMonth()+1);
    if(!map[key]) map[key]={i:0,s:0};
    map[key].i+=num(x.jumlah);
  });

  S.forEach(x=>{
    let t=new Date(x.tanggal);
    let key=t.getFullYear()+"-"+(t.getMonth()+1);
    if(!map[key]) map[key]={i:0,s:0};
    map[key].s+=num(x.jumlah);
  });

  let labels=Object.keys(map);
  let iuran=labels.map(k=>map[k].i);
  let sampah=labels.map(k=>map[k].s);

  new Chart(document.getElementById("chart"),{
    type:'pie',
    data:{
      labels:labels,
      datasets:[
        {label:'Iuran',data:iuran,borderWidth:3},
        {label:'Sampah',data:sampah,borderWidth:3}
      ]
    }
  });
}

/* ===== LAINNYA ===== */
function warga(){
  let tb=document.getElementById("tbWarga");
  tb.innerHTML="<tr><th>Nama</th><th>Rumah</th></tr>";
  W.forEach(w=>tb.innerHTML+=`<tr><td>${w.nama}</td><td>${w.rumah}</td></tr>`);
}

function keuangan(){
  let tb=document.getElementById("tbKeu");
  tb.innerHTML="<tr><th>Tanggal</th><th>Jumlah</th></tr>";
  B.forEach(x=>tb.innerHTML+=`<tr><td>${x.tanggal}</td><td>${rp(num(x.jumlah))}</td></tr>`);
}

function tunggakan(){
  let tb=document.getElementById("tbTunggakan");
  tb.innerHTML="<tr><th>Nama</th></tr>";
  W.forEach(w=>{
    let bayar=B.some(x=>x.warga_id==w.id);
    if(!bayar) tb.innerHTML+=`<tr><td class="bad">${w.nama}</td></tr>`;
  });
}

function kontak(){
  let div=document.getElementById("kontak");
  div.innerHTML="";
  P.forEach(x=>{
    div.innerHTML+=`<p>${x.jabatan} - ${x.nama} 
    <a href="https://wa.me/${x.wa}" target="_blank">📞</a></p>`;
  });
}

function pengumuman(){
  let div=document.getElementById("listPengumuman");
  div.innerHTML="";
  PG.forEach(x=>{
    div.innerHTML+=`<div class="card"><h3>${x.judul}</h3><p>${x.isi}</p></div>`;
  });
}
function convertDrive(link){
  if(!link) return "";
  let match = link.match(/[-\w]{25,}/);
  return match 
    ? `https://drive.google.com/thumbnail?id=${match[0]}&sz=w1000`
    : "";
}
/* ===== LOAD IKLAN ===== */
function loadIklan(){

  fetch(URL_LAPAK)
  .then(r=>r.text())
  .then(data=>{

    let match = data.match(/google\.visualization\.Query\.setResponse\((.*)\);/s);
    if(!match){
      document.getElementById("listIklan").innerHTML = "Data tidak terbaca";
      return;
    }

    let json = JSON.parse(match[1]);
    let rows = json.table.rows || [];

    let html = "";

    rows.reverse().forEach(r=>{

      let penjual = r.c[0]?.v || "";
      let judul   = r.c[1]?.v || "";
      let desc    = r.c[2]?.v || "";
      let harga   = r.c[3]?.v || 0;
      let kontak  = r.c[4]?.v || "";
      let img     = convertDrive(r.c[5]?.v || "");

      html += `
      <div style="display:inline-block;width:200px;margin:10px;
      background:white;padding:10px;border-radius:12px">

        <img src="${img}" style="width:100%;height:140px;object-fit:cover;border-radius:10px"
        onerror="this.src='https://via.placeholder.com/200x140'">

        <b>${judul}</b>
        <p style="font-size:12px">${penjual}</p>
        <p>${desc}</p>
        <p><b>Rp ${Number(harga).toLocaleString()}</b></p>

        <a href="https://wa.me/${kontak}" target="_blank"
        style="display:block;background:#25D366;color:white;text-align:center;padding:5px;border-radius:8px">
        Chat
        </a>

      </div>`;
    });

    document.getElementById("listIklan").innerHTML = html || "Belum ada data";
  })
  .catch(err=>{
    console.log(err);
    document.getElementById("listIklan").innerHTML = "Error load data";
  });
}
function loadMedia(){

  fetch(URL_MEDIA)
  .then(res => res.text())
  .then(data => {

    let match = data.match(/google\.visualization\.Query\.setResponse\((.*)\);/s);

    if(!match){
      document.getElementById("gallery").innerHTML = "Data gagal dibaca";
      console.log("RAW:", data);
      return;
    }

    const json = JSON.parse(match[1]);
    const rows = json.table.rows;

    // 🔥 PARSE TANGGAL SUPER AMAN
    function parseTanggal(t){
      if(!t) return new Date(0);

      // format: Date(2026,3,20)
      if(typeof t === "string" && t.includes("Date(")){
        let m = t.match(/\d+/g);
        return new Date(m[0], m[1], m[2]);
      }

      // format: 2026-04-20
      if(typeof t === "string"){
        let p = t.split("-");
        if(p.length === 3){
          return new Date(p[0], p[1]-1, p[2]);
        }
      }

      // fallback
      return new Date(t);
    }

    // 🔥 SORT TERBARU DI ATAS
    rows.sort((a, b) => {
      return parseTanggal(b.c[3]?.v) - parseTanggal(a.c[3]?.v);
    });

    let html = "";

    rows.forEach((r,i) => {

      let kegiatan   = r.c[0]?.v || "";
      let link       = r.c[1]?.v || "";
      let keterangan = r.c[2]?.v || "";
      let tanggal    = r.c[3]?.v || "";

      let media = "";
      let url = convertDrive(link);

      // 🔥 GOOGLE DRIVE (VIDEO)
      if (link.includes("drive.google.com")) {

        let fileIdMatch = link.match(/\/d\/(.*?)\//);

        if (fileIdMatch) {
          let fileId = fileIdMatch[1];

          media = `
            <iframe 
              src="https://drive.google.com/file/d/${fileId}/preview"
              style="
                width:100%;
                height:150px;
                border:none;
                border-radius:10px;
                background:black;
              ">
            </iframe>
          `;
        }

      }

      // 🔥 VIDEO LANGSUNG
      else if (link.match(/\.(mp4|webm|ogg)$/i)) {

        media = `
          <video controls style="
            width:100%;
            height:150px;
            border-radius:10px;
            object-fit:cover;
            background:black;
          ">
            <source src="${link}" type="video/mp4">
          </video>
        `;
      }

      // 📷 GAMBAR
      else {

        media = `
          <img src="${url}" 
               style="
                 width:100%;
                 height:150px;
                 object-fit:contain;
                 background:white;
                 border-radius:10px;
               "
               onerror="this.src='https://via.placeholder.com/200x150?text=No+Image'">
        `;
      }

      // 🔥 FORMAT TANGGAL (ANTI INVALID)
      let tglFormat = "-";
      let d = parseTanggal(tanggal);

      if(!isNaN(d)){
        tglFormat = d.toLocaleDateString("id-ID", {
          day:"2-digit",
          month:"short",
          year:"numeric"
        });
      }

      // 🔥 CARD
      html += `
        <div style="
          width:200px;
          margin:10px;
          display:inline-block;
          vertical-align:top;
          background:white;
          border-radius:12px;
          padding:10px;
          box-shadow:0 5px 15px rgba(0,0,0,0.1);
        ">
          ${media}
          <b style="display:block;margin-top:8px">${kegiatan}</b>
          <p style="font-size:12px">${keterangan}</p>
          <p style="font-size:11px;color:#64748b">${tglFormat}</p>
        </div>
      `;
    });

    document.getElementById("gallery").innerHTML = html || "Tidak ada data";

  })
  .catch(err=>{
    console.log(err);
    document.getElementById("gallery").innerHTML = "Error load data";
  });

}
function openTab(id){
  document.body.classList.remove("landing");

  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  if(id === "Media"){
    setTimeout(()=>loadMedia(),200);
  }

  if(id === "iklan"){
    loadIklan();
  }

}

function toggleMode(){
  document.body.classList.toggle("dark");
}

load();
hujanDaun();
goHome();
</script>

</body>
</html>
